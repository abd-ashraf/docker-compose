stages:
  - build
  - test
  - deploy
 
variables:
  SSH_USER: "ubuntu"
  SSH_HOST: "86.50.231.23"
  SSH_PRIVATE_KEY: "$SSH_PRIVATE_KEY"

# 1️⃣ Building Docker Image
build:
  stage: build
  script:
    - docker-compose build

# 2️⃣ Running Tests
test:
  stage: test
  script:
    - pip install pytest pytest-mock requests flask
    - docker-compose up -d
    - sleep 10
    - pytest tests/test_services/test_service1.py -v
    - pytest tests/test_services/test_service2.py -v
    - pytest tests/api_gateway/test_api_state.py -v
    - docker-compose down
  needs:
    - build

# 3️⃣ Deploying to CSC VM via SSH
deploy:
  stage: deploy
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keygen -R $SSH_HOST
  script:
    # First, copy all necessary files to the remote server
    - scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no docker-compose.yml $SSH_USER@$SSH_HOST:~/app/
    - scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r nginx/ $SSH_USER@$SSH_HOST:~/app/
    - scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r service1/ $SSH_USER@$SSH_HOST:~/app/
    - scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r service2/ $SSH_USER@$SSH_HOST:~/app/
    
    # Then execute commands on remote server
    - ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
        cd ~/app &&
        docker-compose down || true &&
        docker-compose build --no-cache &&
        docker-compose up -d"
  needs:
    - test