stages:
  - build
  - test
  - deploy
 
variables:
  SSH_USER: "ubuntu"
  SSH_HOST: "86.50.231.23"
  SSH_PRIVATE_KEY: "$SSH_PRIVATE_KEY"

# 1️⃣ Building Docker Image
build:
  stage: build
  script:
    - docker-compose build

# 2️⃣ Running Tests
test:
  stage: test
  script:
    - pip install pytest pytest-mock requests flask
    - docker-compose up -d
    - sleep 20
    - pytest tests/test_services/test_service1.py -v
    - pytest tests/test_services/test_service2.py -v
    - pytest tests/api_gateway/test_api_state.py -v
    - docker-compose down
  needs:
    - build

# 3️⃣ Deploying to CSC VM via SSH
deploy:
  stage: deploy
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
  script:
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'EOF'
      cd ~/app || mkdir ~/app && cd ~/app
      git pull origin project
      docker-compose down
      docker-compose up -d --build
      EOF
  needs:
    - test