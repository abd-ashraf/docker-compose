events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    upstream service1_backend {
        ip_hash;
        server service1-1:8199;
        server service1-2:8199;
        server service1-3:8199;
    }

    # Web Interface Server (8198)
    server {
        # Original web interface port
        # listen 80;
        listen 8198;

        # Login page (unprotected)
        location / {
            root /usr/share/nginx/html;
            index login.html;
        }

        # Protected main interface
        location /index.html {
            root /usr/share/nginx/html;
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # Protected service1 endpoint
        location /service1 {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://service1_backend/;
        }

        # Protected stop endpoint
        location /stop {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://service1_backend/stop;
            proxy_method POST;
        }

        # Protected state endpoint
        location /state {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://service1_backend/state;
            proxy_method $request_method;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $content_type;
        }

        # Protected run-log endpoint
        location /run-log {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://service1_backend/run-log;
        }

        location /logout {
            return 401;
        }
    }

    # API Server (8197)
    server {
        listen 80;
        server_name api; # Add server name

        root /dev/null; # Prevent static file serving

        location /state {
            proxy_pass http://service1_backend/state;
            proxy_method $request_method;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $content_type;
        }
    }
}