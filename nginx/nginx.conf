events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;

    upstream service1_backend {
        ip_hash;
        server service1-1:8199;
        server service1-2:8199;
        server service1-3:8199;
    }

    upstream service2_backend {
        server service2:5000;
    }

    # Web Interface Server (8198)
    server {
        listen 8198;

        # Login page (unprotected)
        location / {
            root /usr/share/nginx/html;
            index login.html;
        }

        # Protected main interface
        location /index.html {
            root /usr/share/nginx/html;
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        location /service1 {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://service1_backend/request;
        }

        location /service2 {
            proxy_pass http://service2_backend/system_info;
        }

        location /stop {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://service1_backend/stop;
            proxy_method POST;
        }

        location /logout {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;

            # Send a 401 response to clear stored authentication
            return 401 "You have been logged out. Please close this window.";
        }


        error_page 403 = /;
    }

    # API Server (8197)
    server {
        listen 8197;
        server_name localhost;

        location /state {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:8198';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Max-Age' 1728000;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' 'http://localhost:8198';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Allow-Credentials' 'true';

            proxy_pass http://service1_backend/state;
            proxy_set_header Host $host;
        }

        location /run-log {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:8198';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Allow-Credentials' 'true';

            proxy_pass http://service1_backend/run-log;
        }

        location /request {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:8198';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Allow-Credentials' 'true';

            proxy_pass http://service1_backend/request;
        }
    }
}
